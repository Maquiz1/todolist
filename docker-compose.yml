version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: todolist_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=todolist_db
      - POSTGRES_USER=todo_user
      - POSTGRES_PASSWORD=todo_secure_pass
    ports:
      - "5432:5432"
    restart: always

  web:
    build: ./backend
    container_name: todolist_web
    command: /app/entrypoint.sh
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://todo_user:todo_secure_pass@db:5432/todolist_db
      - SECRET_KEY=replace_this_with_a_long_random_string_in_production
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - LOAD_SEED_DATA=true
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:
