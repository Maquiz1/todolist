version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: todolist_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=todolist_db
      - POSTGRES_USER=todo_user
      - POSTGRES_PASSWORD=todo_secure_pass
    ports:
      - "5432:5432"
    restart: always

  web:
    build: ./backend
    container_name: todolist_web
    command: /app/entrypoint.sh
    volumes:
      - /opt/todolist/backend:/app
      - /opt/todolist/backend/staticfiles:/app/staticfiles
    ports:
      - "80:8000"
    env_file:
      - /opt/todolist/backend/.env
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:
